<section class="page-head" data-accent="orange">
  <div class="wrap">
    <p class="kicker">At the taproom</p>
    <h1 class="display h1">What's <em class="spray">on</em></h1>
    <p class="lead">Quizzes, records, screenings and tap takeovers. Save the date, tell us you're coming, and grab a table while you're at it.</p>
  </div>
</section>

<section class="section section-tight" data-accent="orange" aria-label="Events">
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="When">
      <button class="tab" role="tab" id="tab-week" aria-controls="panel-events" aria-selected="true" data-when="week">This week</button>
      <button class="tab" role="tab" id="tab-up" aria-controls="panel-events" aria-selected="false" tabindex="-1" data-when="upcoming">Upcoming</button>
      <button class="tab" role="tab" id="tab-past" aria-controls="panel-events" aria-selected="false" tabindex="-1" data-when="past">Past</button>
    </div>
    <div role="tabpanel" id="panel-events" tabindex="0">
      <div class="event-list" data-events="page"></div>
    </div>
  </div>
</section>
